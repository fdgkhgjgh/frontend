<!-- 全球+国内 快递查询组件（100% 稳定直达版） -->
<div id="express-tracker" style="
    margin: 8px 8px 0 8px;
    background: rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 10px 12px;
    backdrop-filter: blur(4px);
">
    <div style="display:flex; align-items:center; gap:8px;">
        <input type="text" id="YQNum" maxlength="50" placeholder="单号(全球)delivery package check" style="
            flex: 1;
            padding: 5px 8px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            background: rgba(255,255,255,0.2);
            color: inherit;
            font-size: 0.9rem;
            outline: none;
        "/>
        <button type="button" onclick="doExpressTrack()" style="
            background: #10b981;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            white-space: nowrap;
        ">查快递</button>
    </div>
</div>

<script type="text/javascript">
function doExpressTrack() {
    var input = document.getElementById("YQNum");
    var num = input ? input.value.trim().toUpperCase() : "";
    
    if (!num) {
        alert("请输入快递单号！");
        return;
    }

    // 判断是否为国内快递（纯数字或 SF/JT/JD/YT 等国内前缀）
    var isDomestic = /^\d+$/.test(num) || /^(SF|JT|JTE|JD|YT|YTO|DB|STO|ZTO|YUNDA)/.test(num);

    if (isDomestic) {
        // 国内单号：百度卡片直达（无限额度，支持顺丰/极兔/邮政等）
        window.open('https://www.baidu.com/s?wd=' + encodeURIComponent(num), '_blank');
    } else {
        // 国际单号：17TRACK 官方结果页直达（解决手机端/Safari脚本被拦截无响应的问题）
        window.open('https://www.17track.net/zh-cn/track#nums=' + encodeURIComponent(num), '_blank');
    }
}
</script>

<script>
// 控制弹窗开关
function toggleMarketModal() {
    const modal = document.getElementById('market-modal');
    if (modal) {
        modal.style.display = (modal.style.display === 'none' || !modal.style.display) ? 'flex' : 'none';
    }
}

// 点击遮罩阴影区域自动关闭
document.getElementById('market-modal').addEventListener('click', function(e) {
    if (e.target === this) {
        toggleMarketModal();
    }
});

let isFallbackLoaded = false;
const TWELVE_API_KEY = '493ab34d589e4093bd422633ecdfb479';

// 更新 Key 版本号以强制清空本地旧缓存
const CACHE_KEY = 'twelve_market_data_v2';
const CACHE_TIME_KEY = 'twelve_market_time_v2';
const EXPIRE_TIME = 6 * 60 * 60 * 1000; // 6 小时缓存

// 降级方案：Twelve Data + 6小时 localStorage 智能缓存
async function switchToDomesticSource() {
    if (isFallbackLoaded) return;
    isFallbackLoaded = true;

    const container = document.getElementById('tv-widget-box');
    if (!container) return;

    container.innerHTML = `
        <div style="font-size: 0.75rem; color: #fbbf24; text-align: center; margin-bottom: 8px;">
            ⚡ 受限于免费api,此为ETF指数，其涨跌幅百分比与大盘点数、现货价一致（每6h更新）
        </div>
        <div id="domestic-market-list" style="
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            overflow-y: auto; 
            flex: 1; 
            padding-right: 4px;
        ">
            <div style="color: #aaa; text-align: center; padding: 30px 0; font-size: 0.85rem;">实时行情加载中...</div>
        </div>
    `;

    // 替换为 Twelve Data 免费版完全开放且支持的 ETF/商品代号
    const items = [
        { name: '🇨🇳 上证指数', symbol: '000001' },
        { name: '🇭🇰 恒生 ETF', symbol: 'EWH' },
        { name: '🇺🇸 标普500 (SPY)', symbol: 'SPY' },
        { name: '🇺🇸 纳斯达克 (QQQ)', symbol: 'QQQ' },
        { name: '🇯🇵 日经 ETF', symbol: 'EWJ' },
        { name: '🇩🇪 德国 DAX ETF', symbol: 'EWG' },
        { name: '🏆 现货黄金', symbol: 'XAU/USD' },
        { name: '🛢️ WTI 原油', symbol: 'USO' }
    ];

    const cachedData = localStorage.getItem(CACHE_KEY);
    const cachedTime = localStorage.getItem(CACHE_TIME_KEY);
    const now = Date.now();

    let data = null;

    // 校验是否有缓存且在 6 小时有效期内
    if (cachedData && cachedTime && (now - parseInt(cachedTime) < EXPIRE_TIME)) {
        try {
            data = JSON.parse(cachedData);
        } catch(e) {
            data = null;
        }
    }

    // 如果没有有效缓存，才发起 API 请求
    if (!data) {
        const symbolsQuery = items.map(i => encodeURIComponent(i.symbol)).join(',');
        const apiUrl = `https://api.twelvedata.com/quote?symbol=${symbolsQuery}&apikey=${TWELVE_API_KEY}`;

        try {
            const response = await fetch(apiUrl);
            data = await response.json();

            // 请求成功后写入本地缓存并记录时间
            if (data && !data.code) {
                localStorage.setItem(CACHE_KEY, JSON.stringify(data));
                localStorage.setItem(CACHE_TIME_KEY, now.toString());
            }
        } catch (error) {
            console.error('Twelve Data 请求失败:', error);
        }
    }

    renderMarketList(data, items);
}

// 渲染列表函数
function renderMarketList(data, items) {
    const listEl = document.getElementById('domestic-market-list');
    if (!listEl) return;

    if (!data) {
        listEl.innerHTML = '<div style="color:#ef4444; text-align:center;">行情数据获取失败</div>';
        return;
    }

    let html = '';

    items.forEach(item => {
        const itemData = data[item.symbol] || (data.symbol === item.symbol ? data : null);
        if (!itemData || itemData.status === 'error' || !itemData.close) return;

        const price = parseFloat(itemData.close).toFixed(2);
        const change = parseFloat(itemData.change || 0).toFixed(2);
        const percentChange = parseFloat(itemData.percent_change || 0).toFixed(2);

        const isUp = parseFloat(percentChange) >= 0;
        const color = isUp ? '#10b981' : '#ef4444'; // 绿涨红跌 (美式)
        const sign = isUp ? '+' : '';

        html += `
            <div style="
                display: flex;
                justify-content: space-between;
                align-items: center;
                background: rgba(255, 255, 255, 0.08);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 8px;
                padding: 10px 12px;
            ">
                <span style="color: #fff; font-weight: 500; font-size: 0.88rem;">${item.name}</span>
                <div style="text-align: right;">
                    <div style="color: #fff; font-weight: bold; font-size: 0.9rem;">${price}</div>
                    <div style="color: ${color}; font-size: 0.75rem; font-weight: 500;">
                        ${sign}${change} (${sign}${percentChange}%)
                    </div>
                </div>
            </div>
        `;
    });

    listEl.innerHTML = html || '<div style="color:#aaa; text-align:center;">暂无最新行情数据</div>';
}

// 自动检测网络：如果 3.5 秒内 TradingView 被 GFW 阻断，自动触发直连降级渲染
setTimeout(() => {
    const tvIframe = document.querySelector('.tradingview-widget-container iframe');
    if (!tvIframe) {
        switchToDomesticSource();
    }
}, 3500);
</script>
